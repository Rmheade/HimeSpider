<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Simple Button Page</title>
   <style>
       body {
           font-family: sans-serif;
           display: flex;
           justify-content: center;
           align-items: center;
           height: 100vh;
           margin: 0;
           background-color: #f4f4f9;
       }
       .container {
           display: flex;
           gap: 20px;
       }
       button {
           padding: 15px 30px;
           font-size: 16px;
           cursor: pointer;
           background-color: #007bff;
           color: white;
           border: none;
           border-radius: 5px;
           transition: background-color 0.3s;
       }
       button:hover {
           background-color: #0056b3;
       }
   </style>
</head>
<body>

   <div class="container">
       <button onclick="openThing('https://studying.work.gd/games.html')">Games</button>
       <button onclick="openThing('https://scr.koyeb.app')">Unblocker</button>
       <button onclick="openThing('https://lkarch.org/omtegu/embedder.html')">Omtegu Embedder</button>
   </div>
</body>
<script>
 function openThing(game) {
   var url = game
   var win = window.open('about:blank', '_blank');
   win.document.body.style.margin = '0';
   win.document.body.style.height = '100vh'
   var iframe = win.document.createElement('iframe');
   iframe.style.border = 'none';
   iframe.style.width = '100%';
   iframe.style.height = '100%';
   iframe.src=url
   win.document.body.appendChild(iframe);
 }
</script>
</html>
